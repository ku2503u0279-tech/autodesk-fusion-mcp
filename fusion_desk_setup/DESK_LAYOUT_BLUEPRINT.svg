  <text x="44" y="48" fill="#f0f6fc" font-size="16" font-weight="bold">OVERENGINEERED COMPACT DESK SYSTEM — ORTHOGRAPHIC CAD LAYOUT (ALL UNITS: mm)</text>
  <text x="44" y="67" fill="#8b949e" font-size="11">TABLE + MAT: 630 x 280 x (18+3) mm  |  SHARED INTERFACE: DT-30 (30 mm 60° Dovetail)  |  MAX PRINT BED: &lt;= 196 x 190 x 185 mm (&lt;200³ mm)</text>
  <text x="1156" y="56" fill="#ff4d6d" font-size="12" font-weight="bold" text-anchor="end">ZERO SCREWS · ZERO MAT LOSS</text>

