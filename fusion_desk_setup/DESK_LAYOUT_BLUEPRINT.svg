  <!-- Blueprint Background -->
  <rect width="1200" height="920" fill="#0d1117"/>
  <rect x="24" y="24" width="1152" height="872" fill="url(#grid100)" stroke="#30363d" stroke-width="2"/>

  <!-- Title Block -->
